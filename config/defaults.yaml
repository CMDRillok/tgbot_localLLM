# Значения по умолчанию. Владелец меняет их прямо в боте — они лягут в SQLite.
# Этот файл используется только для первого запуска и сброса.

# Пустой путь = выбрать модель автоматически из MODELS_DIRS.
model: ""

# --- llama.cpp / сервер ---
ctx_size: 8192
n_gpu_layers: 999        # 999 = авто: --fit сам подбирает слои под VRAM
threads: 8
parallel: 1
flash_attn: "on"
cache_type_k: "q8_0"
cache_type_v: "q8_0"
fit: "on"
fit_target: 256

# --- генерация ---
temperature: 0.7
top_p: 0.95
top_k: 40
repeat_penalty: 1.05
max_tokens: 1024
reasoning: "off"
system_prompt: |
  Ты полезный и дружелюбный ассистент. Отвечай на языке пользователя,
  понятно и по существу. Не выдумывай факты; если не знаешь — честно скажи.
  Для кода используй markdown-блоки.

# --- история ---
max_messages: 20
history_max_tokens: 6000

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tgbot-localllm"
version = "0.1.0"
description = "Telegram-бот для общения с локальной LLM через llama.cpp"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.20",
    "aiosqlite>=0.21",
    "httpx>=0.28",
    "PyYAML>=6.0",
    "python-dotenv>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[project.scripts]
tgllm = "tgllm.__main__:main"
tgllm-server = "tgllm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
